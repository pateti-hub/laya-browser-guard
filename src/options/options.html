<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laya settings</title><link rel="stylesheet" href="options.css"></head>
<body><main><h1>Laya Browser Guard settings</h1><p>Analysis runs locally in your browser.</p>
<label><input id="retain" type="checkbox"> Retain the latest analysis result locally</label>
<label><input id="model" type="checkbox" disabled> Enable Laya/Jev model <small>(available after a compatible model artifact is installed)</small></label>
<button id="save">Save settings</button><span id="status"></span>
<h2>Privacy defaults</h2><ul><li>No form values are read.</li><li>No page evidence is sent to a server.</li><li>Only the active page is analyzed after you click the extension.</li></ul>
</main><script src="options.js"></script></body></html>
